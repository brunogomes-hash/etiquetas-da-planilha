name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build estático
        run: bun run build
        env:
          GITHUB_PAGES: "true"

      - name: Preparar pasta de publicação
        run: |
          if [ -f .output/public/index.html ]; then OUT=.output/public
          elif [ -f dist/client/index.html ]; then OUT=dist/client
          else
            echo "index.html não encontrado. Arquivos encontrados:"
            find . -name index.html -not -path "./node_modules/*"
            exit 1
          fi
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
